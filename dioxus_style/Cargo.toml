[package]
name = "dioxus_style"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Scoped CSS/SCSS styling system for Dioxus components with compile-time processing and SCSS support"
readme = "../README.md"
keywords = ["dioxus", "css", "scss", "scoped", "styling"]
categories = ["web-programming", "gui"]
rust-version.workspace = true

[dependencies]
dioxus_style_macro = { version = "0.4.1", path = "../dioxus_style_macro" }

[dev-dependencies]
# Add test dependencies here if needed

[features]
default = ["scss"]
scss = ["dioxus_style_macro/scss"]  # Enable SCSS support

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# What to include in the published package
include = [
    "src/**/*",
    "Cargo.toml",
    "../README.md",
    "../LICENSE-MIT",
    "../LICENSE-APACHE",
]

# Exclude these from the published package
exclude = [
    "../PUBLISHING_CHECKLIST.md",
    "../.github/",
    "../examples/",
]